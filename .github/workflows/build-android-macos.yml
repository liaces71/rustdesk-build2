# TEMPLATE (rustdesk-custom-client skill): Android(aarch64/armv7/x86_64) + macOS(x86_64/aarch64) 客户端构建（共用 bridge）。
# 已知可用：run 36664428679。配套 bridge.yml 必须同置于 .github/workflows/。
# 改私有仓库：改 env.PRIV_REPO；改品牌前缀：搜 "weimbio-1.5.0-" 替换。
name: RustDesk Custom Client (Android & macOS)
on:
  workflow_dispatch:
env:
  SCITER_RUST_VERSION: "1.75" # https://github.com/rustdesk/rustdesk/discussions/7503, also 1.78 has ABI change which causes our sciter version not working, https://blog.rust-lang.org/2024/03/30/i128-layout-update.html
  RUST_VERSION: "1.75" # sciter failed on m1 with 1.78 because of https://blog.rust-lang.org/2024/03/30/i128-layout-update.html
  MAC_RUST_VERSION: "1.81" # 1.81 is requred for macos, because of https://github.com/yury/cidre requires 1.81
  CARGO_NDK_VERSION: "3.1.2"
  SCITER_ARMV7_CMAKE_VERSION: "3.29.7"
  SCITER_NASM_DEBVERSION: "2.15.05-1"
  LLVM_VERSION: "15.0.6"
  FLUTTER_VERSION: "3.24.5"
  ANDROID_FLUTTER_VERSION: "3.24.5"
  TAG_NAME: "custom"
  VCPKG_BINARY_SOURCES: "clear;x-gha,readwrite"
  VCPKG_COMMIT_ID: "9e593bb18ea69cc5095e012465dcd675a822ed0d"
  VCPKG_CMAKE_VERSION: "4.3.0"
  VERSION: "1.5.0"
  NDK_VERSION: "r28c"
  #signing keys env variable checks
  ANDROID_SIGNING_KEY: "${{ secrets.ANDROID_SIGNING_KEY }}"
  MACOS_P12_BASE64: "${{ secrets.MACOS_P12_BASE64 }}"
  UPLOAD_ARTIFACT: "true"
  SIGN_BASE_URL: "${{ secrets.SIGN_BASE_URL }}-2"
  # 交付目标私有仓库（产物重命名为 weimbio-* 后推到此处 tag=custom）。换仓库只改这里。
  PRIV_REPO: "liaces71/rustdesk-custom-client"


jobs:
  generate-bridge:
    uses: ./.github/workflows/bridge.yml

  build-rustdesk-android:
    needs: [generate-bridge]
    name: build rustdesk android apk ${{ matrix.job.target }}
    runs-on: ${{ matrix.job.os }}
    strategy:
      fail-fast: false
      matrix:
        job:
          - {
              arch: aarch64,
              target: aarch64-linux-android,
              os: ubuntu-24.04,
              reltype: release,
              suffix: "",
            }
          - {
              arch: armv7,
              target: armv7-linux-androideabi,
              os: ubuntu-24.04,
              reltype: release,
              suffix: "",
            }
          - {
              arch: x86_64,
              target: x86_64-linux-android,
              os: ubuntu-24.04,
              reltype: release,
              suffix: "",
            }
    steps:
      - name: Free Disk Space (Ubuntu)
        uses: jlumbroso/free-disk-space@54081f138730dfa15788a46383842cd2f914a1be # v1.3.1
        with:
          tool-cache: false
          android: false
          dotnet: true
          haskell: true
          large-packages: false
          docker-images: true
          swap-storage: false

      - name: Export GitHub Actions cache environment variables
        uses: actions/github-script@d7906e4ad0b1822421a7e6a35d5ca353c962f410 # v6
        with:
          script: |
            core.exportVariable('ACTIONS_CACHE_URL', process.env.ACTIONS_CACHE_URL || '');
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '');

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
               clang \
               cmake \
               curl \
               gcc-multilib \
               git \
               g++ \
               g++-multilib \
               libayatana-appindicator3-dev \
               libasound2-dev \
               libc6-dev \
               libclang-dev \
               libunwind-dev \
               libgstreamer1.0-dev \
               libgstreamer-plugins-base1.0-dev \
               libgtk-3-dev \
               libpulse-dev \
               libva-dev \
               libxcb-randr0-dev \
               libxcb-shape0-dev \
               libxcb-xfixes0-dev \
               libxdo-dev \
               libxfixes-dev \
               llvm-dev \
               nasm \
               ninja-build \
               openjdk-17-jdk-headless \
               pkg-config \
               tree \
               wget

      - name: Checkout RustDesk source (official v1.5.0)
        shell: bash
        run: |
          git clone --depth 1 --branch 1.5.0 --recurse-submodules --shallow-submodules https://github.com/rustdesk/rustdesk.git rd_src
          shopt -s dotglob
          mv rd_src/* . 2>/dev/null || true
          for f in rd_src/.[!.]*; do [ -e "$f" ] && mv "$f" . 2>/dev/null || true; done
          rm -rf rd_src

      - name: Inject custom server info
        shell: bash
        env:
          RD_SERVER: ${{ secrets.RENDEZVOUS_SERVER }}
          RD_KEY: ${{ secrets.RS_PUB_KEY }}
          RD_API: ${{ secrets.API_SERVER }}
        run: |
          set -e
          if [ -z "${RD_SERVER}" ]; then
            echo "RENDEZVOUS_SERVER secret is empty, skip injection."
            exit 0
          fi
          # GNU sed(Linux/Windows Git Bash) 用 -i，BSD sed(macOS) 必须 -i ''，否则会把替换式当成备份后缀
          sedi() {
            if sed --version >/dev/null 2>&1; then
              sed -i "$1" "$2"
            else
              sed -i '' "$1" "$2"
            fi
          }
          sedi "s|^pub const RENDEZVOUS_SERVERS.*|pub const RENDEZVOUS_SERVERS: \&[\&str] = \&[\"${RD_SERVER}\"];|" libs/hbb_common/src/config.rs
          sedi "s|^pub const RS_PUB_KEY.*|pub const RS_PUB_KEY: \&str = \"${RD_KEY}\";|" libs/hbb_common/src/config.rs
          if [ -n "${RD_API}" ]; then
            sedi "s|https://admin.rustdesk.com|${RD_API}|g" src/common.rs
          fi
          echo "--- injected ---"
          grep -n "pub const RENDEZVOUS_SERVERS" libs/hbb_common/src/config.rs
      - name: Patch secure_tcp (fix login-state timeout)
        shell: bash
        run: |
          python3 -c "import re; p='src/common.rs'; s=open(p).read(); m=re.search(r'pub async fn secure_tcp',s); i=s.find('{',m.end()); nl=chr(10); patch=nl+'    // PATCH: skip secure_tcp handshake to fix login-state timeout'+nl+'    return Ok(());'+nl; open(p,'w').write(s[:i+1]+patch+s[i+1:]); print('Patched src/common.rs: secure_tcp returns Ok immediately')"
          echo "--- verify secure_tcp patch ---"
          grep -n -A2 "pub async fn secure_tcp" src/common.rs | head -8
      - name: Allow cleartext HTTP (Android blocks plain http by default)
        # RustDesk 1.5.0 的 AndroidManifest 未声明 usesCleartextTraffic，而 Android 9+(targetSdk>=28)
        # 默认禁止明文流量。内置 API 是 http://139.155.151.149:21114 时，登录请求会被系统层拦掉，
        # 表现为「用户名或密码错误」（桌面端无此限制，所以同账号能登）。
        shell: bash
        run: |
          M=flutter/android/app/src/main/AndroidManifest.xml
          sedi() {
            if sed --version >/dev/null 2>&1; then
              sed -i "$1" "$2"
            else
              sed -i '' "$1" "$2"
            fi
          }
          sedi 's|<application|<application android:usesCleartextTraffic="true"|' "$M"
          echo "--- verify cleartext patch ---"
          grep -n "usesCleartextTraffic" "$M"
      - name: Install flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: "stable"
          flutter-version: ${{ env.ANDROID_FLUTTER_VERSION }}

      - name: Patch flutter
        run: |
          cd $(dirname $(dirname $(which flutter)))
          if [[ "3.24.5" == ${{env.ANDROID_FLUTTER_VERSION}} ]]; then
            git apply ${{ github.workspace }}/.github/patches/flutter_3.24.4_dropdown_menu_enableFilter.diff
          fi

      - uses: nttld/setup-ndk@ed92fe6cadad69be94a966a7ee3271275e62f779 # v1
        id: setup-ndk
        with:
          ndk-version: ${{ env.NDK_VERSION }}
          add-to-path: true

      - name: Setup vcpkg with Github Actions binary cache
        uses: lukka/run-vcpkg@b1a0dd252f06b9e25b3c022a9a03bd7a427fb6a2 # v11
        with:
          vcpkgDirectory: /opt/artifacts/vcpkg
          vcpkgGitCommitId: ${{ env.VCPKG_COMMIT_ID }}
          doNotCache: false

      - name: Install vcpkg dependencies
        run: |
          case ${{ matrix.job.target }} in
            aarch64-linux-android)
              ANDROID_TARGET=arm64-v8a
            ;;
            armv7-linux-androideabi)
              ANDROID_TARGET=armeabi-v7a
            ;;
            x86_64-linux-android)
              ANDROID_TARGET=x86_64
            ;;
            i686-linux-android)
              ANDROID_TARGET=x86
            ;;
          esac
          if ! ./flutter/build_android_deps.sh "${ANDROID_TARGET}"; then
            find "${VCPKG_ROOT}/" -name "*.log" | while read -r _1; do
              echo "$_1:"
              echo "======"
              cat "$_1"
              echo "======"
              echo ""
            done
            exit 1
          fi
        shell: bash

      - name: Restore bridge files
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: bridge-artifact
          path: ./

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: ${{ env.RUST_VERSION }}
          components: "rustfmt"

      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          prefix-key: rustdesk-lib-cache-android # TODO: drop '-android' part after caches are invalidated
          key: ${{ matrix.job.target }}

      - name: Build rustdesk lib
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
          ANDROID_NDK_ROOT: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: |
          rustup target add ${{ matrix.job.target }}
          cargo install cargo-ndk --version ${{ env.CARGO_NDK_VERSION }} --locked
          case ${{ matrix.job.target }} in
            aarch64-linux-android)
              ./flutter/ndk_arm64.sh
              mkdir -p ./flutter/android/app/src/main/jniLibs/arm64-v8a
              cp ./target/${{ matrix.job.target }}/release/liblibrustdesk.so ./flutter/android/app/src/main/jniLibs/arm64-v8a/librustdesk.so
            ;;
            armv7-linux-androideabi)
              ./flutter/ndk_arm.sh
              mkdir -p ./flutter/android/app/src/main/jniLibs/armeabi-v7a
              cp ./target/${{ matrix.job.target }}/release/liblibrustdesk.so ./flutter/android/app/src/main/jniLibs/armeabi-v7a/librustdesk.so
            ;;
            x86_64-linux-android)
              ./flutter/ndk_x64.sh
              mkdir -p ./flutter/android/app/src/main/jniLibs/x86_64
              cp ./target/${{ matrix.job.target }}/release/liblibrustdesk.so ./flutter/android/app/src/main/jniLibs/x86_64/librustdesk.so
            ;;
            i686-linux-android)
              ./flutter/ndk_x86.sh
              mkdir -p ./flutter/android/app/src/main/jniLibs/x86
              cp ./target/${{ matrix.job.target }}/release/liblibrustdesk.so ./flutter/android/app/src/main/jniLibs/x86/librustdesk.so
            ;;
          esac

      - name: Build rustdesk
        shell: bash
        env:
          JAVA_HOME: /usr/lib/jvm/java-17-openjdk-amd64
        run: |
          export PATH=/usr/lib/jvm/java-17-openjdk-amd64/bin:$PATH
          # Increase Gradle JVM memory for CI builds
          sed -i "s/org.gradle.jvmargs=-Xmx1024M/org.gradle.jvmargs=-Xmx2g/g" ./flutter/android/gradle.properties
          # temporary use debug sign config
          sed -i "s/signingConfigs.release/signingConfigs.debug/g" ./flutter/android/app/build.gradle
          case ${{ matrix.job.target }} in
            aarch64-linux-android)
              mkdir -p ./flutter/android/app/src/main/jniLibs/arm64-v8a
              cp ${ANDROID_NDK_HOME}/toolchains/llvm/prebuilt/linux-x86_64/sysroot/usr/lib/aarch64-linux-android/libc++_shared.so ./flutter/android/app/src/main/jniLibs/arm64-v8a/
              cp ./target/${{ matrix.job.target }}/release/liblibrustdesk.so ./flutter/android/app/src/main/jniLibs/arm64-v8a/librustdesk.so
              # build flutter
              pushd flutter
              flutter build apk "--${{ matrix.job.reltype }}" --target-platform android-arm64 --split-per-abi
              mv build/app/outputs/flutter-apk/app-arm64-v8a-${{ matrix.job.reltype }}.apk ../rustdesk-${{ env.VERSION }}-${{ matrix.job.arch }}${{ matrix.job.suffix }}.apk
            ;;
            armv7-linux-androideabi)
              mkdir -p ./flutter/android/app/src/main/jniLibs/armeabi-v7a
              cp ${ANDROID_NDK_HOME}/toolchains/llvm/prebuilt/linux-x86_64/sysroot/usr/lib/arm-linux-androideabi/libc++_shared.so ./flutter/android/app/src/main/jniLibs/armeabi-v7a/
              cp ./target/${{ matrix.job.target }}/release/liblibrustdesk.so ./flutter/android/app/src/main/jniLibs/armeabi-v7a/librustdesk.so
              # build flutter
              pushd flutter
              flutter build apk "--${{ matrix.job.reltype }}" --target-platform android-arm --split-per-abi
              mv build/app/outputs/flutter-apk/app-armeabi-v7a-${{ matrix.job.reltype }}.apk ../rustdesk-${{ env.VERSION }}-${{ matrix.job.arch }}${{ matrix.job.suffix }}.apk
            ;;
            x86_64-linux-android)
              mkdir -p ./flutter/android/app/src/main/jniLibs/x86_64
              cp ${ANDROID_NDK_HOME}/toolchains/llvm/prebuilt/linux-x86_64/sysroot/usr/lib/x86_64-linux-android/libc++_shared.so ./flutter/android/app/src/main/jniLibs/x86_64/
              cp ./target/${{ matrix.job.target }}/release/liblibrustdesk.so ./flutter/android/app/src/main/jniLibs/x86_64/librustdesk.so
              # build flutter
              pushd flutter
              flutter build apk "--${{ matrix.job.reltype }}" --target-platform android-x64 --split-per-abi
              mv build/app/outputs/flutter-apk/app-x86_64-${{ matrix.job.reltype }}.apk ../rustdesk-${{ env.VERSION }}-${{ matrix.job.arch }}${{ matrix.job.suffix }}.apk
            ;;
            i686-linux-android)
              mkdir -p ./flutter/android/app/src/main/jniLibs/x86
              cp ${ANDROID_NDK_HOME}/toolchains/llvm/prebuilt/linux-x86_64/sysroot/usr/lib/i686-linux-android/libc++_shared.so ./flutter/android/app/src/main/jniLibs/x86/
              cp ./target/${{ matrix.job.target }}/release/liblibrustdesk.so ./flutter/android/app/src/main/jniLibs/x86/librustdesk.so
              # build flutter
              pushd flutter
              flutter build apk "--${{ matrix.job.reltype }}" --target-platform android-x86 --split-per-abi
              mv build/app/outputs/flutter-apk/app-x86-${{ matrix.job.reltype }}.apk ../rustdesk-${{ env.VERSION }}-${{ matrix.job.arch }}${{ matrix.job.suffix }}.apk
            ;;
          esac
          popd
          mkdir -p signed-apk; pushd signed-apk
          mv ../rustdesk-${{ env.VERSION }}-${{ matrix.job.arch }}${{ matrix.job.suffix }}.apk .

      # https://github.com/r0adkll/sign-android-release/issues/84#issuecomment-1889636075
      - name: Setup sign tool version variable
        shell: bash
        run: |
          BUILD_TOOL_VERSION=$(ls /usr/local/lib/android/sdk/build-tools/ | tail -n 1)
          echo "ANDROID_SIGN_TOOL_VERSION=$BUILD_TOOL_VERSION" >> $GITHUB_ENV
          echo Last build tool version is: $BUILD_TOOL_VERSION

      - uses: r0adkll/sign-android-release@349ebdef58775b1e0d8099458af0816dc79b6407 # v1
        name: Sign app APK
        if: env.ANDROID_SIGNING_KEY != null && env.ANDROID_SIGNING_KEY != ''
        id: sign-rustdesk
        with:
          releaseDirectory: ./signed-apk
          signingKeyBase64: ${{ secrets.ANDROID_SIGNING_KEY }}
          alias: ${{ secrets.ANDROID_ALIAS }}
          keyStorePassword: ${{ secrets.ANDROID_KEY_STORE_PASSWORD }}
          keyPassword: ${{ secrets.ANDROID_KEY_PASSWORD }}
        env:
          # env.ANDROID_SIGN_TOOL_VERSION is set by Step "Setup sign tool version variable"
          BUILD_TOOLS_VERSION: ${{ env.ANDROID_SIGN_TOOL_VERSION }}

      - name: Rename artifacts for delivery
        shell: bash
        run: |
          mkdir -p deliver
          if [ -f "./signed-apk/rustdesk-${{ env.VERSION }}-${{ matrix.job.arch }}.apk" ]; then
            cp "./signed-apk/rustdesk-${{ env.VERSION }}-${{ matrix.job.arch }}.apk" "./deliver/weimbio-1.5.0-android-${{ matrix.job.arch }}.apk"
          else
            # fall back to the signed output produced by the sign step
            signed=$(ls ./signed-apk/*${{ matrix.job.arch }}*.apk | head -1)
            cp "$signed" "./deliver/weimbio-1.5.0-android-${{ matrix.job.arch }}.apk"
          fi
          ls -l ./deliver

      - name: Remove stale Android assets from private release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.PAT }}
          PRIV_REPO: liaces71/rustdesk-custom-client
        run: |
          for f in weimbio-1.5.0-android-${{ matrix.job.arch }}.apk rustdesk-1.5.0-android-${{ matrix.job.arch }}.apk; do
            ids=$(curl -s -H "Authorization: Bearer $GH_TOKEN" "https://api.github.com/repos/$PRIV_REPO/releases/tags/custom" \
              | python3 -c "import sys,json; d=json.load(sys.stdin); print(' '.join(str(a['id']) for a in d.get('assets',[]) if a['name']=='$f'))" 2>/dev/null)
            for id in $ids; do
              [ -n "$id" ] && curl -s -X DELETE -H "Authorization: Bearer $GH_TOKEN" "https://api.github.com/repos/$PRIV_REPO/releases/assets/$id"
            done
          done

      - name: Publish Release to private repo
        uses: softprops/action-gh-release@de2c0eb89ae2a093876385947365aca7b0e5f844 # v1
        with:
          token: ${{ secrets.PAT }}
          repository: ${{ env.PRIV_REPO }}
          prerelease: true
          tag_name: custom
          files: |
            ./deliver/weimbio-1.5.0-android-${{ matrix.job.arch }}.apk

  build-for-macOS:
    name: ${{ matrix.job.target }}
    runs-on: ${{ matrix.job.os }}
    needs: [generate-bridge]
    strategy:
      fail-fast: false
      matrix:
        job:
          - {
              target: x86_64-apple-darwin,
              os: macos-15-intel, #macos-latest or macos-14 use M1 now
              extra-build-args: "",
              arch: x86_64,
              vcpkg-triplet: x64-osx,
            }
          - {
              target: aarch64-apple-darwin,
              os: macos-14,
              extra-build-args: "--screencapturekit",
              arch: aarch64,
              vcpkg-triplet: arm64-osx,
            }
    steps:
      - name: Export GitHub Actions cache environment variables
        uses: actions/github-script@d7906e4ad0b1822421a7e6a35d5ca353c962f410 # v6
        with:
          script: |
            core.exportVariable('ACTIONS_CACHE_URL', process.env.ACTIONS_CACHE_URL || '');
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '');

      - name: Checkout RustDesk source (official v1.5.0)
        shell: bash
        run: |
          git clone --depth 1 --branch 1.5.0 --recurse-submodules --shallow-submodules https://github.com/rustdesk/rustdesk.git rd_src
          shopt -s dotglob
          mv rd_src/* . 2>/dev/null || true
          for f in rd_src/.[!.]*; do [ -e "$f" ] && mv "$f" . 2>/dev/null || true; done
          rm -rf rd_src

      - name: Inject custom server info
        shell: bash
        env:
          RD_SERVER: ${{ secrets.RENDEZVOUS_SERVER }}
          RD_KEY: ${{ secrets.RS_PUB_KEY }}
          RD_API: ${{ secrets.API_SERVER }}
        run: |
          set -e
          if [ -z "${RD_SERVER}" ]; then
            echo "RENDEZVOUS_SERVER secret is empty, skip injection."
            exit 0
          fi
          # GNU sed(Linux/Windows Git Bash) 用 -i，BSD sed(macOS) 必须 -i ''，否则会把替换式当成备份后缀
          sedi() {
            if sed --version >/dev/null 2>&1; then
              sed -i "$1" "$2"
            else
              sed -i '' "$1" "$2"
            fi
          }
          sedi "s|^pub const RENDEZVOUS_SERVERS.*|pub const RENDEZVOUS_SERVERS: \&[\&str] = \&[\"${RD_SERVER}\"];|" libs/hbb_common/src/config.rs
          sedi "s|^pub const RS_PUB_KEY.*|pub const RS_PUB_KEY: \&str = \"${RD_KEY}\";|" libs/hbb_common/src/config.rs
          if [ -n "${RD_API}" ]; then
            sedi "s|https://admin.rustdesk.com|${RD_API}|g" src/common.rs
          fi
          echo "--- injected ---"
          grep -n "pub const RENDEZVOUS_SERVERS" libs/hbb_common/src/config.rs
      - name: Patch secure_tcp (fix login-state timeout)
        shell: bash
        run: |
          python3 -c "import re; p='src/common.rs'; s=open(p).read(); m=re.search(r'pub async fn secure_tcp',s); i=s.find('{',m.end()); nl=chr(10); patch=nl+'    // PATCH: skip secure_tcp handshake to fix login-state timeout'+nl+'    return Ok(());'+nl; open(p,'w').write(s[:i+1]+patch+s[i+1:]); print('Patched src/common.rs: secure_tcp returns Ok immediately')"
          echo "--- verify secure_tcp patch ---"
          grep -n -A2 "pub async fn secure_tcp" src/common.rs | head -8
      - name: Install build runtime
        run: |
          brew install llvm create-dmg
          # pkg-config is handled in a separate step, because it may be already installed by `macos-latest`(14.7.1) runner
          if command -v pkg-config &>/dev/null; then
              echo "pkg-config is already installed"
          else
              brew install pkg-config
          fi

      - name: Install NASM
        run: |
          # Install NASM 2.16.x from official release.
          # Do NOT use `brew install nasm` which installs NASM 3.x.
          # NASM 3.x is a complete rewrite with incompatible CLI options and removed features.
          # aom and other multimedia libraries require NASM 2.x for x86/x86_64 assembly.
          wget https://www.nasm.us/pub/nasm/releasebuilds/2.16.03/macosx/nasm-2.16.03-macosx.zip
          unzip nasm-2.16.03-macosx.zip
          sudo cp nasm-2.16.03/nasm /usr/local/bin/nasm
          nasm --version

      - name: Install flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: "stable"
          flutter-version: ${{ env.FLUTTER_VERSION }}

      - name: Patch flutter
        run: |
          cd $(dirname $(dirname $(which flutter)))
          if [[ "3.24.5" == ${{env.FLUTTER_VERSION}} ]]; then
            git apply ${{ github.workspace }}/.github/patches/flutter_3.24.4_dropdown_menu_enableFilter.diff
          fi

      - name: Workaround for flutter issue
        shell: bash
        run: |
          cd "$(dirname "$(which flutter)")"
          # https://github.com/flutter/flutter/issues/133533
          sed -i -e 's/_setFramesEnabledState(false);/\/\/_setFramesEnabledState(false);/g' ../packages/flutter/lib/src/scheduler/binding.dart
          grep -n '_setFramesEnabledState(false);' ../packages/flutter/lib/src/scheduler/binding.dart

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: ${{ env.MAC_RUST_VERSION }}
          targets: ${{ matrix.job.target }}
          components: "rustfmt"

      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          prefix-key: ${{ matrix.job.os }}

      - name: Restore bridge files
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: bridge-artifact
          path: ./

      - name: Setup vcpkg with Github Actions binary cache
        uses: lukka/run-vcpkg@b1a0dd252f06b9e25b3c022a9a03bd7a427fb6a2 # v11
        with:
          vcpkgGitCommitId: ${{ env.VCPKG_COMMIT_ID }}
          doNotCache: false

      - name: Install vcpkg dependencies
        run: |
          if ! $VCPKG_ROOT/vcpkg \
            install \
            --x-install-root="$VCPKG_ROOT/installed"; then
            find "${VCPKG_ROOT}/" -name "*.log" | while read -r _1; do
              echo "$_1:"
              echo "======"
              cat "$_1"
              echo "======"
              echo ""
            done
            exit 1
          fi
          head -n 100 "${VCPKG_ROOT}/buildtrees/ffmpeg/build-${{ matrix.job.vcpkg-triplet }}-rel-out.log" || true

      - name: Show version information (Rust, cargo, Clang)
        shell: bash
        run: |
          clang --version || true
          rustup -V
          rustup toolchain list
          rustup default
          cargo -V
          rustc -V

      - name: Build rustdesk
        run: |
          if [ "${{ matrix.job.target }}" = "aarch64-apple-darwin" ]; then
            MIN_MACOS_VERSION="12.3"
            sed -i -e "s/MACOSX_DEPLOYMENT_TARGET\=[0-9]*.[0-9]*/MACOSX_DEPLOYMENT_TARGET=${MIN_MACOS_VERSION}/" build.py
            sed -i -e "s/platform :osx, '.*'/platform :osx, '${MIN_MACOS_VERSION}'/" flutter/macos/Podfile
            sed -i -e "s/osx_minimum_system_version = \"[0-9]*.[0-9]*\"/osx_minimum_system_version = \"${MIN_MACOS_VERSION}\"/" Cargo.toml
            sed -i -e "s/MACOSX_DEPLOYMENT_TARGET = [0-9]*.[0-9]*;/MACOSX_DEPLOYMENT_TARGET = ${MIN_MACOS_VERSION};/" flutter/macos/Runner.xcodeproj/project.pbxproj
          fi
          ./build.py --flutter --hwcodec --unix-file-copy-paste ${{ matrix.job.extra-build-args }}

      - name: create unsigned dmg
        if: env.UPLOAD_ARTIFACT == 'true'
        run: |
          CREATE_DMG="$(command -v create-dmg)"
          CREATE_DMG="$(readlink -f "$CREATE_DMG")"
          sed -i -e 's/MAXIMUM_UNMOUNTING_ATTEMPTS=3/MAXIMUM_UNMOUNTING_ATTEMPTS=7/' "$CREATE_DMG"
          create-dmg --icon "RustDesk.app" 200 190 --hide-extension "RustDesk.app" --window-size 800 400 --app-drop-link 600 185 rustdesk-${{ env.VERSION }}-${{ matrix.job.arch }}.dmg ./flutter/build/macos/Build/Products/Release/RustDesk.app

      - name: Rename artifacts for delivery
        if: env.UPLOAD_ARTIFACT == 'true'
        shell: bash
        run: |
          mkdir -p deliver
          if [ -f "./rustdesk-${{ env.VERSION }}-${{ matrix.job.arch }}.dmg" ]; then
            cp "./rustdesk-${{ env.VERSION }}-${{ matrix.job.arch }}.dmg" "./deliver/weimbio-1.5.0-macos-${{ matrix.job.arch }}.dmg"
          else
            dmg=$(ls ./rustdesk*.dmg | head -1)
            cp "$dmg" "./deliver/weimbio-1.5.0-macos-${{ matrix.job.arch }}.dmg"
          fi
          ls -l ./deliver

      - name: Remove stale macOS assets from private release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.PAT }}
          PRIV_REPO: liaces71/rustdesk-custom-client
        run: |
          for f in weimbio-1.5.0-macos-${{ matrix.job.arch }}.dmg rustdesk-1.5.0-macos-${{ matrix.job.arch }}.dmg; do
            ids=$(curl -s -H "Authorization: Bearer $GH_TOKEN" "https://api.github.com/repos/$PRIV_REPO/releases/tags/custom" \
              | python3 -c "import sys,json; d=json.load(sys.stdin); print(' '.join(str(a['id']) for a in d.get('assets',[]) if a['name']=='$f'))" 2>/dev/null)
            for id in $ids; do
              [ -n "$id" ] && curl -s -X DELETE -H "Authorization: Bearer $GH_TOKEN" "https://api.github.com/repos/$PRIV_REPO/releases/assets/$id"
            done
          done

      - name: Publish Release to private repo
        uses: softprops/action-gh-release@de2c0eb89ae2a093876385947365aca7b0e5f844 # v1
        with:
          token: ${{ secrets.PAT }}
          repository: ${{ env.PRIV_REPO }}
          prerelease: true
          tag_name: custom
          files: |
            ./deliver/weimbio-1.5.0-macos-${{ matrix.job.arch }}.dmg
